services:
  sonora-proxy:
    image: ghcr.io/muhwldns/sonora-online-music-player/proxy:latest
    # Fallback build lokal: context repo root (lockfile & workspace ada di root)
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    restart: unless-stopped
