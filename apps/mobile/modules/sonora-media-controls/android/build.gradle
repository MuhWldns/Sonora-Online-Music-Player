plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.sonora.music.mediacontrols'
version = '1.3.1'

android {
  namespace "com.sonora.music.mediacontrols"
  defaultConfig {
    versionCode 6
    versionName "1.3.1"
  }
}

dependencies {
  implementation "androidx.media3:media3-exoplayer:1.9.0"
  implementation "androidx.media3:media3-session:1.9.0"
}
