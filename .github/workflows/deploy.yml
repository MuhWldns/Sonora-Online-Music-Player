name: Deploy Proxy

on:
  push:
    branches: [main]
    paths:
      - 'packages/proxy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # GHCR mensyaratkan lowercase; github.repository punya huruf besar (MuhWldns/...)
  IMAGE_NAME: ${{ github.repository }}/proxy

jobs:
  build-push:
    name: Build & push Docker image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image name (GHCR requirement)
        id: image
        env:
          REPO: ${{ github.repository }}
        run: echo "name=${REPO,,}/proxy" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/proxy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vps:
    name: Deploy to VPS
    needs: build-push
    runs-on: ubuntu-latest
    # Butuh repo secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY (private key),
    # dan compose file /sonora/docker-compose.yml di VPS yang pakai image GHCR.
    if: ${{ vars.VPS_HOST != '' }}
    steps:
      - name: Diagnose secrets presence (annotations only, values never printed)
        env:
          H: ${{ secrets.VPS_HOST }}
          U: ${{ secrets.VPS_USER }}
          K: ${{ secrets.VPS_SSH_KEY }}
        run: |
          missing=""
          [ -z "$H" ] && missing="$missing VPS_HOST"
          [ -z "$U" ] && missing="$missing VPS_USER"
          [ -z "$K" ] && missing="$missing VPS_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::MISSING SECRETS:$missing - add them in Settings > Secrets and variables > Actions > Secrets tab"
          else
            echo "::error::All secrets set. Key first line: $(echo "$K" | head -c 34), last line: $(echo "$K" | tail -1 | head -c 25)"
          fi

      - name: Diagnose connectivity (result visible via public annotations API)
        run: |
          if timeout 15 bash -c 'cat < /dev/null > /dev/tcp/45.198.149.134/2104' 2>/dev/null; then
            echo "::error::TCP-OK: GitHub runner CAN reach 45.198.149.134:2104 - failure is key/auth"
          else
            echo "::error::TCP-BLOCKED: GitHub runner CANNOT reach 45.198.149.134:2104"
          fi

      - name: Write SSH key to temp file (auto-wrap base64 body if PEM header missing)
        env:
          RAW_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          KEYFILE="$RUNNER_TEMP/sonora_id_key"
          if echo "$RAW_KEY" | head -1 | grep -q "BEGIN OPENSSH"; then
            printf '%s\n' "$RAW_KEY" > "$KEYFILE"
            echo "key already has PEM header"
          else
            printf '%s\n%s\n%s\n' "-----BEGIN OPENSSH PRIVATE KEY-----" "$RAW_KEY" "-----END OPENSSH PRIVATE KEY-----" > "$KEYFILE"
            echo "::warning::VPS_SSH_KEY secret lacks PEM header/footer (base64 body only) - auto-wrapped. Re-paste the FULL key file to fix properly."
          fi
          chmod 600 "$KEYFILE"
          FP=$(ssh-keygen -lf "$KEYFILE" 2>/dev/null | awk '{print $2}')
          echo "RECONSTRUCTED_KEY_FINGERPRINT: $FP"
          if [ "$FP" != "SHA256:HL9afWG/ItzZHMdHOJXAHXYGU/gMmEhnf/YaXbz8sJg" ]; then
            echo "::error::Fingerprint MISMATCH - secret is a different/incomplete key than the one authorized on the VPS"
          else
            echo "::notice::Fingerprint matches the local key authorized on VPS"
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: 2104
          key_path: ${{ runner.temp }}/sonora_id_key
          debug: true
          script: |
            cd /sonora
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
