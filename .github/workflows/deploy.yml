name: Deploy Proxy

on:
  push:
    branches: [main]
    paths:
      - 'packages/proxy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # GHCR mensyaratkan lowercase; github.repository punya huruf besar (MuhWldns/...)
  IMAGE_NAME: ${{ github.repository }}/proxy

jobs:
  build-push:
    name: Build & push Docker image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image name (GHCR requirement)
        id: image
        env:
          REPO: ${{ github.repository }}
        run: echo "name=${REPO,,}/proxy" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/proxy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vps:
    name: Deploy to VPS
    needs: build-push
    runs-on: ubuntu-latest
    # Secrets yang dibutuhkan: VPS_HOST, VPS_USER, VPS_PORT (opsional default 22),
    # VPS_PASSWORD (password auth) atau VPS_SSH_KEY (private key — pilih salah satu).
    # Compose file /sonora/docker-compose.yml harus sudah ada di VPS.
    if: ${{ secrets.VPS_HOST != '' }}
    steps:
      - name: Write SSH key to temp file
        if: ${{ secrets.VPS_SSH_KEY != '' }}
        env:
          RAW_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          KEYFILE="$RUNNER_TEMP/sonora_id_key"
          if echo "$RAW_KEY" | head -1 | grep -q "BEGIN OPENSSH"; then
            printf '%s\n' "$RAW_KEY" > "$KEYFILE"
          else
            printf '%s\n%s\n%s\n' "-----BEGIN OPENSSH PRIVATE KEY-----" "$RAW_KEY" "-----END OPENSSH PRIVATE KEY-----" > "$KEYFILE"
            echo "::warning::VPS_SSH_KEY lacks PEM header — auto-wrapped. Re-paste full key to fix."
          fi
          chmod 600 "$KEYFILE"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          password: ${{ secrets.VPS_PASSWORD }}
          key_path: ${{ secrets.VPS_SSH_KEY != '' && format('{0}/sonora_id_key', runner.temp) || '' }}
          script: |
            cd /sonora
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
