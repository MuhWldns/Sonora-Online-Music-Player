name: Deploy Proxy

on:
  push:
    branches: [main]
    paths:
      - 'packages/proxy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # GHCR mensyaratkan lowercase; github.repository punya huruf besar (MuhWldns/...)
  IMAGE_NAME: ${{ github.repository }}/proxy

jobs:
  build-push:
    name: Build & push Docker image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image name (GHCR requirement)
        id: image
        env:
          REPO: ${{ github.repository }}
        run: echo "name=${REPO,,}/proxy" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/proxy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vps:
    name: Deploy to VPS
    needs: build-push
    runs-on: ubuntu-latest
    # Butuh repo secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY (private key),
    # dan compose file /sonora/docker-compose.yml di VPS yang pakai image GHCR.
    if: ${{ vars.VPS_HOST != '' }}
    steps:
      - name: Diagnose connectivity (result visible via public annotations API)
        run: |
          if timeout 15 bash -c 'cat < /dev/null > /dev/tcp/45.198.149.134/2104' 2>/dev/null; then
            echo "::error::TCP-OK: GitHub runner CAN reach 45.198.149.134:2104 - failure is key/auth"
          else
            echo "::error::TCP-BLOCKED: GitHub runner CANNOT reach 45.198.149.134:2104"
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          debug: true
          script: |
            cd /sonora
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
