name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  proxy:
    name: Proxy typecheck + bundle check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/proxy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Typecheck
        run: npm run typecheck

      - name: Workers bundle dry-run
        run: npm run check:cf

  app:
    name: Mobile app typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Typecheck
        run: npx tsc --noEmit
